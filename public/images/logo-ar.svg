<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond noir absolu premium avec coin arrondi squircle -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="#000000" stroke="rgba(255, 255, 255, 0.14)" stroke-width="2"/>
  
  <!-- Lueur de fond très subtile pour détacher le badge sur fond noir -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#08090d"/>

  <!-- Trace A : Montée dynamique et descente vers le centre -->
  <path d="M 22 72 L 40 22 C 41.5 18 46.5 18 48 22 L 56 44" 
        stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Traverse du A qui s'élance pour former la boucle fluide du R -->
  <path d="M 31 52 H 60 C 69 52 75 46 75 37 C 75 28 69 22 60 22 H 47" 
        stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Jambe du R : Déconnexion tranchante néon (Rupture / Anti-Réseau) -->
  <path d="M 58 52 L 74 72" 
        stroke="#ff0055" stroke-width="8" stroke-linecap="round"/>

  <!-- Point de signal déconnecté -->
  <circle cx="74" cy="72" r="3" fill="#ffffff"/>
</svg>